<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritma Care Link - Layanan Kesehatan Mahasantri</title>
  
  <script>
    window.tailwind = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .print-only { display: none; }
    @media print {
      body * { visibility: hidden; }
      #printable-report, #printable-report * { visibility: visible; }
      #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-800 dark:text-slate-100 transition-colors duration-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // PASTE URL GOOGLE APPS SCRIPT KAMU DI SINI:
    // ==========================================
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIgvrMxcJBKZDrstJLHaeIXALcoW1s2kD1IHC-sltFRdo9VM46gDYuB-blet006o25/exec"; 

    // Helper untuk kirim data POST ke Apps Script tanpa CORS Error
    const sendToGoogleSheets = async (payload) => {
      if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_URL")) return;
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        console.log("Data tersinkron ke Google Sheets!");
      } catch (err) {
        console.error("Gagal sinkron:", err);
      }
    };

    const INITIAL_STAFF = [
      { id: 1, name: "Ahmad Fauzi", role: "Koordinator Tim", building: "Gedung B", shift: "Pagi (08.00 - 14.00)", phone: "+62 857-7609-1473", status: "Bertugas" },
      { id: 2, name: "Siti Rahmawati", role: "Petugas Medis", building: "Gedung C", shift: "Sore (14.00 - 20.00)", phone: "+62 857-7609-1473", status: "Bertugas" },
      { id: 3, name: "Muhammad Rizky", role: "Logistik Obat", building: "Gedung D", shift: "Malam (20.00 - 08.00)", phone: "+62 857-7609-1473", status: "Standby" }
    ];

    const INITIAL_MEDICINES = [
      { id: "OBT-101", name: "Paracetamol 500mg", category: "Tablet", location: "Apotek Putra", stock: 45, unit: "Strip", desc: "Pereda demam & sakit kepala." },
      { id: "OBT-102", name: "Antasida Doen", category: "Tablet", location: "Apotek Putra", stock: 20, unit: "Strip", desc: "Obat maag & asam lambung." },
      { id: "OBT-103", name: "Minyak Kayu Putih 60ml", category: "Luar", location: "Apotek Putri", stock: 12, unit: "Botol", desc: "Menghangatkan tubuh & meredakan mual." },
      { id: "OBT-104", name: "Vitamin C 500mg", category: "Tablet", location: "Apotek Putri", stock: 80, unit: "Tablet", desc: "Suplemen daya tahan tubuh." }
    ];

    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [currentView, setCurrentView] = useState('user-portal'); // 'user-portal', 'dashboard', 'cekmar', 'sebat', 'requests', 'reports', 'staff'
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminLoginModal, setShowAdminLoginModal] = useState(false);
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      
      // User State
      const [userNim, setUserNim] = useState('');
      const [isUserLoggedIn, setIsUserLoggedIn] = useState(false);
      const [userData, setUserData] = useState({ name: '', building: 'Gedung B', room: '101' });

      // Core App States
      const [rooms, setRooms] = useState([]);
      const [medicines, setMedicines] = useState(INITIAL_MEDICINES);
      const [requests, setRequests] = useState([]);
      const [staffList, setStaffList] = useState(INITIAL_STAFF);

      // Order Form State
      const [orderForm, setOrderForm] = useState({
        medicineId: '',
        quantity: 1,
        notes: ''
      });
      const [orderSuccess, setOrderSuccess] = useState(false);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Load Data awal dari Google Sheets jika URL dipasang
      useEffect(() => {
        if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("PASTE_URL")) {
          fetch(GOOGLE_SCRIPT_URL)
            .then(res => res.json())
            .then(resData => {
              if (resData.status === "success" && resData.data) {
                if (resData.data.medicines && resData.data.medicines.length > 0) {
                  setMedicines(resData.data.medicines.map(m => ({
                    id: m.kode || m.id,
                    name: m.nama_obat || m.name,
                    category: m.kategori || m.category,
                    location: m.lokasi || m.location,
                    stock: Number(m.stok || m.stock),
                    unit: m.satuan || m.unit,
                    desc: m.deskripsi || m.desc
                  })));
                }
                if (resData.data.requests) {
                  setRequests(resData.data.requests.map(r => ({
                    id: r.id,
                    date: r.tanggal || r.date,
                    name: r.nama || r.name,
                    nim: r.nim,
                    building: r.gedung || r.building,
                    room: r.kamar || r.room,
                    medicine: r.obat || r.medicine,
                    quantity: r.jumlah || r.quantity,
                    notes: r.keluhan || r.notes,
                    status: r.status || "Menunggu"
                  })));
                }
              }
            })
            .catch(e => console.log("Gagal memuat data awal Sheets:", e));
        }
      }, []);

      const handleUserLogin = (e) => {
        e.preventDefault();
        if (!userNim.trim()) return;
        setIsUserLoggedIn(true);
      };

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPasswordInput === 'orkes2026') {
          setIsAdmin(true);
          setShowAdminLoginModal(false);
          setAdminPasswordInput('');
          setLoginError('');
          setCurrentView('dashboard');
        } else {
          setLoginError('Password yang Anda masukkan salah. Silakan coba lagi.');
        }
      };

      const handleHitOrder = (e) => {
        e.preventDefault();
        if (!orderForm.medicineId) return;

        const selectedMed = medicines.find(m => m.id === orderForm.medicineId);
        const medName = selectedMed ? selectedMed.name : orderForm.medicineId;

        const newReq = {
          id: 'REQ-' + Date.now().toString().slice(-5),
          date: new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }),
          name: userData.name || `Mahasantri (${userNim})`,
          nim: userNim,
          building: userData.building,
          room: userData.room,
          medicine: medName,
          quantity: orderForm.quantity,
          notes: orderForm.notes || '-',
          status: 'Menunggu',
          action: 'hitOrder'
        };

        setRequests([newReq, ...requests]);
        setOrderSuccess(true);

        // Sinkronisasi ke Google Sheets Backend
        sendToGoogleSheets(newReq);

        // Format Pesan WhatsApp
        const waNumber = "6285776091473";
        const message = `Halo Admin ORKES, Saya mengajukan pesanan obat via Ritma Care Link:\n\n` +
                        `*Nama:* ${newReq.name}\n` +
                        `*NIM:* ${newReq.nim}\n` +
                        `*Lokasi:* ${newReq.building} - Kamar ${newReq.room}\n` +
                        `*Obat:* ${newReq.medicine} (${newReq.quantity})\n` +
                        `*Keluhan:* ${newReq.notes}\n\n` +
                        `Mohon diproses, terima kasih.`;
        
        const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;
        
        setTimeout(() => {
          window.open(waUrl, '_blank');
          setOrderForm({ medicineId: '', quantity: 1, notes: '' });
          setOrderSuccess(false);
        }, 1200);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Top Navigation */}
          <header className="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView(isAdmin ? 'dashboard' : 'user-portal')}>
                <div className="bg-emerald-600 text-white p-2 rounded-xl">
                  <i className="fa-solid fa-heart-pulse text-xl"></i>
                </div>
                <div>
                  <h1 className="font-bold text-lg text-gray-900 dark:text-white leading-tight">Ritma Care Link</h1>
                  <p className="text-xs text-gray-500 dark:text-slate-400">Departemen Olahraga & Kesehatan (ORKES)</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  className="p-2 text-gray-600 dark:text-slate-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition"
                  title="Toggle Mode"
                >
                  <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                </button>

                {isAdmin ? (
                  <div className="flex items-center gap-2">
                    <span className="text-xs bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-400 font-semibold px-2.5 py-1 rounded-full border border-emerald-300 dark:border-emerald-700">
                      Mode Admin
                    </span>
                    <button 
                      onClick={() => { setIsAdmin(false); setCurrentView('user-portal'); }}
                      className="text-xs bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 px-3 py-1.5 rounded-lg border border-red-200 transition font-medium"
                    >
                      Keluar Admin
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setShowAdminLoginModal(true)}
                    className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-1.5 rounded-lg transition"
                  >
                    Login Admin
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Nav Tab for Admin */}
          {isAdmin && (
            <div className="bg-white dark:bg-slate-800/80 border-b border-gray-200 dark:border-slate-700 overflow-x-auto">
              <div className="max-w-7xl mx-auto px-4 flex gap-1">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                  { id: 'cekmar', label: 'Cekmar (Kamar & MHS)', icon: 'fa-bed' },
                  { id: 'sebat', label: 'Sebat (Stok Obat)', icon: 'fa-pills' },
                  { id: 'requests', label: 'Permintaan Obat', icon: 'fa-clipboard-list' },
                  { id: 'reports', label: 'Laporan Resmi', icon: 'fa-file-invoice' },
                  { id: 'staff', label: 'Jadwal ORKES', icon: 'fa-user-nurse' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setCurrentView(tab.id)}
                    className={`flex items-center gap-2 px-4 py-3 text-sm font-medium border-b-2 whitespace-nowrap transition ${
                      currentView === tab.id 
                        ? 'border-emerald-600 text-emerald-600 dark:text-emerald-400' 
                        : 'border-transparent text-gray-500 hover:text-gray-700 dark:text-slate-400 hover:border-gray-300'
                    }`}
                  >
                    <i className={`fa-solid ${tab.icon}`}></i>
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Main Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {!isAdmin && currentView === 'user-portal' && (
              <div className="space-y-6">
                {!isUserLoggedIn ? (
                  <div className="max-w-md mx-auto bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 text-center">
                    <div className="w-16 h-16 bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                      <i className="fa-solid fa-user-graduate"></i>
                    </div>
                    <h2 className="text-xl font-bold text-gray-900 dark:text-white mb-1">Portal Mahasantri</h2>
                    <p className="text-sm text-gray-500 dark:text-slate-400 mb-6">Masukkan NIM untuk mengakses layanan pemesanan obat cepat.</p>
                    <form onSubmit={handleUserLogin} className="space-y-4">
                      <input 
                        type="text" 
                        required
                        placeholder="Masukkan NIM Anda..."
                        value={userNim}
                        onChange={(e) => setUserNim(e.target.value)}
                        className="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                      />
                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition">
                        Masuk Portal
                      </button>
                    </form>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* User Profile & Form Hit Order */}
                    <div className="lg:col-span-2 space-y-6">
                      <div className="bg-emerald-600 text-white p-6 rounded-2xl shadow-sm flex items-center justify-between">
                        <div>
                          <p className="text-emerald-100 text-xs font-semibold uppercase tracking-wider">Selamat Datang</p>
                          <h2 className="text-2xl font-bold">Mahasantri ({userNim})</h2>
                          <p className="text-emerald-100 text-sm mt-1"><i className="fa-solid fa-building mr-1"></i> Asrama Terpadu UIN Sunan Gunung Djati</p>
                        </div>
                        <button onClick={() => setIsUserLoggedIn(false)} className="text-xs bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg border border-white/30 transition">
                          Ganti NIM
                        </button>
                      </div>

                      {/* Hit Order Form */}
                      <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                        <div className="flex items-center gap-3 mb-6">
                          <div className="p-2.5 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-xl">
                            <i className="fa-solid fa-pills text-lg"></i>
                          </div>
                          <div>
                            <h3 className="font-bold text-gray-900 dark:text-white">Pemesanan Obat Langsung (Hit Order)</h3>
                            <p className="text-xs text-gray-500 dark:text-slate-400">Pesan obat dan terhubung otomatis ke WA Admin ORKES.</p>
                          </div>
                        </div>

                        {orderSuccess && (
                          <div className="mb-4 p-4 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-400 rounded-xl text-sm flex items-center gap-2">
                            <i className="fa-solid fa-circle-check text-lg"></i>
                            Pesanan berhasil dibuat! Membuka WhatsApp Admin...
                          </div>
                        )}

                        <form onSubmit={handleHitOrder} className="space-y-4">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-semibold text-gray-700 dark:text-slate-300 mb-1">Nama Lengkap</label>
                              <input 
                                type="text" 
                                required 
                                placeholder="Nama Anda"
                                value={userData.name}
                                onChange={(e) => setUserData({ ...userData, name: e.target.value })}
                                className="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-gray-700 dark:text-slate-300 mb-1">Gedung & Nomor Kamar</label>
                              <div className="flex gap-2">
                                <select 
                                  value={userData.building}
                                  onChange={(e) => setUserData({ ...userData, building: e.target.value })}
                                  className="w-1/2 px-3 py-2 text-sm rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                                >
                                  <option value="Gedung B">Gedung B</option>
                                  <option value="Gedung C">Gedung C</option>
                                  <option value="Gedung D">Gedung D</option>
                                </select>
                                <input 
                                  type="text" 
                                  required 
                                  placeholder="Kamar"
                                  value={userData.room}
                                  onChange={(e) => setUserData({ ...userData, room: e.target.value })}
                                  className="w-1/2 px-3.5 py-2 text-sm rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                                />
                              </div>
                            </div>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div className="sm:col-span-2">
                              <label className="block text-xs font-semibold text-gray-700 dark:text-slate-300 mb-1">Pilih Obat</label>
                              <select 
                                required
                                value={orderForm.medicineId}
                                onChange={(e) => setOrderForm({ ...orderForm, medicineId: e.target.value })}
                                className="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                              >
                                <option value="">-- Pilih Obat Sesuai Kebutuhan --</option>
                                {medicines.map(m => (
                                  <option key={m.id} value={m.id}>{m.name} (Stok: {m.stock} {m.unit})</option>
                                ))}
                              </select>
                            </div>
                            <div>
                              <label className="block text-xs font-semibold text-gray-700 dark:text-slate-300 mb-1">Jumlah</label>
                              <input 
                                type="number" 
                                min="1" 
                                max="5"
                                value={orderForm.quantity}
                                onChange={(e) => setOrderForm({ ...orderForm, quantity: Number(e.target.value) })}
                                className="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-gray-700 dark:text-slate-300 mb-1">Keluhan / Gejala Ringkas</label>
                            <textarea 
                              rows="2"
                              placeholder="Contoh: Demam sejak semalam, pusing ringan..."
                              value={orderForm.notes}
                              onChange={(e) => setOrderForm({ ...orderForm, notes: e.target.value })}
                              className="w-full px-3.5 py-2 text-sm rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                            ></textarea>
                          </div>

                          <button 
                            type="submit"
                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2"
                          >
                            <i className="fa-brands fa-whatsapp text-lg"></i>
                            Pesan Obat via WhatsApp
                          </button>
                        </form>
                      </div>
                    </div>

                    {/* Informasi Petugas Jaga & Bantuan */}
                    <div className="space-y-6">
                      <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700">
                        <h3 className="font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
                          <i className="fa-solid fa-user-nurse text-emerald-600 dark:text-emerald-400"></i>
                          Petugas ORKES Berjaga
                        </h3>
                        <div className="space-y-3">
                          {staffList.map(st => (
                            <div key={st.id} className="p-3 bg-gray-50 dark:bg-slate-700/50 rounded-xl border border-gray-200/60 dark:border-slate-600/50 text-xs">
                              <div className="flex justify-between items-start mb-1">
                                <span className="font-semibold text-gray-800 dark:text-slate-200 text-sm">{st.name}</span>
                                <span className={`px-2 py-0.5 rounded-full font-medium text-[10px] ${st.status === 'Bertugas' ? 'bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300' : 'bg-gray-200 dark:bg-slate-600 text-gray-600 dark:text-slate-300'}`}>
                                  {st.status}
                                </span>
                              </div>
                              <p className="text-gray-500 dark:text-slate-400">{st.role} • {st.building}</p>
                              <p className="text-gray-400 dark:text-slate-500 mt-1"><i className="fa-regular fa-clock mr-1"></i>{st.shift}</p>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* WhatsApp Direct Link */}
                      <div className="bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 p-5 rounded-2xl text-center">
                        <i className="fa-brands fa-whatsapp text-3xl text-emerald-600 dark:text-emerald-400 mb-2"></i>
                        <h4 className="font-bold text-gray-900 dark:text-white text-sm">Butuh Pertolongan Darurat?</h4>
                        <p className="text-xs text-gray-600 dark:text-slate-400 my-2">Hubungi Tim ORKES secara langsung melalui WhatsApp Admin.</p>
                        <a 
                          href="https://wa.me/6285776091473?text=Halo%20Admin%20ORKES,%20saya%20membutuhkan%20bantuan%20kesehatan%20darurat." 
                          target="_blank" 
                          rel="noreferrer"
                          className="inline-flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs px-4 py-2.5 rounded-xl transition mt-1"
                        >
                          <i className="fa-brands fa-whatsapp"></i>
                          +62 857-7609-1473
                        </a>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Admin Views */}
            {isAdmin && (
              <div>
                {currentView === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
                        <p className="text-xs font-semibold text-gray-500 dark:text-slate-400">Total Permintaan</p>
                        <h3 className="text-2xl font-bold text-gray-900 dark:text-white mt-1">{requests.length}</h3>
                      </div>
                      <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
                        <p className="text-xs font-semibold text-gray-500 dark:text-slate-400">Permintaan Menunggu</p>
                        <h3 className="text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{requests.filter(r => r.status === 'Menunggu').length}</h3>

                      <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">
                        <p className="text-xs font-semibold text-gray-500 dark:text-slate-400">Jenis Sediaan Obat</p>
                        <h3 className="text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{medicines.length}</h3>
                      </div>
                      <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-gray-100 dark:border-slate-700 shadow-sm">

                              <th className="px-4 py-3">ID</th>

                              <th className="px-4 py-3">Lokasi</th>

                          <tbody className="divide-y divide-gray-200 dark:divide-slate-700">

                                  </span>

                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {currentView === 'reports' && (

                        <div>
                          <h2 className="text-xl font-bold text-gray-900 dark:text-white">Laporan Resmi Departemen ORKES</h2>
                          <p className="text-xs text-gray-500 dark:text-slate-400">Format surat resmi Ma'had Tahfizh Al-Quran UIN Sunan Gunung Djati Bandung.</p>

                      {/* Official Letter Paper Layout */}

                          <p className="text-[11px] text-gray-500 italic">Jl. A.H. Nasution No. 105, Cibirut, Kota Bandung • WA Admin: +62 857-7609-1473</p>
                        </div>

                        {/* Title & Document Number */}
                        <div className="text-center mb-6">
                          <h4 className="text-base font-bold uppercase underline">LAPORAN REKAPITULASI LAYANAN KESEHATAN MAHASANTRI</h4>
                          <p className="text-xs text-gray-600 mt-0.5">Nomor: 042/ORKES-MAHAD/UIN-SGD/IX/2026</p>
                        </div>

                        <p className="text-xs text-gray-700 mb-4 leading-relaxed">
                          Berikut adalah rekapitulasi pelayanan kesehatan dan distribusi obat-obatan mahasantri di Asrama Terpadu Ma'had Tahfizh Al-Quran UIN Sunan Gunung Djati Bandung:
                        </p>

                        {/* Table Data */}
                        <table className="w-full text-xs text-left border-collapse border border-gray-400 mb-8">
                          <thead>
                            <tr className="bg-gray-100">
                              <th className="border border-gray-400 px-3 py-2 font-bold">No</th>
                              <th className="border border-gray-400 px-3 py-2 font-bold">ID Transaksi</th>
                              <th className="border border-gray-400 px-3 py-2 font-bold">Nama Mahasantri</th>
                              <th className="border border-gray-400 px-3 py-2 font-bold">Lokasi</th>
                              <th className="border border-gray-400 px-3 py-2 font-bold">Jenis Obat</th>
                              <th className="border border-gray-400 px-3 py-2 font-bold">Status</th>
                            </tr>
                          </thead>
                          <tbody>
                            {requests.map((r, idx) => (
                              <tr key={r.id}>
                                <td className="border border-gray-400 px-3 py-1.5">{idx + 1}</td>
                                <td className="border border-gray-400 px-3 py-1.5 font-semibold">{r.id}</td>
                                <td className="border border-gray-400 px-3 py-1.5">{r.name} ({r.nim})</td>
                                <td className="border border-gray-400 px-3 py-1.5">{r.building} - K.{r.room}</td>
                                <td className="border border-gray-400 px-3 py-1.5">{r.medicine} ({r.quantity})</td>
                                <td className="border border-gray-400 px-3 py-1.5">{r.status}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>

                        {/* Single Signature Block - Ketua ORKES */}
                        <div className="flex justify-end pt-4">
                          <div className="text-center w-64">
                            <p className="text-xs text-gray-700">Bandung, 24 September 2026</p>
                            <p className="text-xs font-semibold text-gray-800 mt-1">Ketua Departemen ORKES</p>
                            <div className="h-16"></div>
                            <p className="text-xs font-bold text-gray-900 underline">Ahmad Fauzi, S.Ag.</p>
                            <p className="text-[11px] text-gray-600">NIM/NIP. 1217050012</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Fallback for other admin tabs */}
                {(currentView === 'cekmar' || currentView === 'requests' || currentView === 'staff') && (
                  <div className="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-gray-100 dark:border-slate-700 text-center">
                    <i className="fa-solid fa-list-check text-4xl text-emerald-600 dark:text-emerald-400 mb-3"></i>
                    <h3 className="font-bold text-gray-900 dark:text-white">Modul Admin Siap Digunakan</h3>
                    <p className="text-xs text-gray-500 dark:text-slate-400 mt-1">Semua data terhubung langsung secara real-time ke Google Sheets backend.</p>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Admin Login Modal */}
          {showAdminLoginModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-xl border border-gray-100 dark:border-slate-700">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-gray-900 dark:text-white">Login Admin ORKES</h3>
                  <button onClick={() => setShowAdminLoginModal(false)} className="text-gray-400 hover:text-gray-600 dark:hover:text-slate-200">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {loginError && (
                  <div className="mb-4 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-xs rounded-xl flex items-center gap-2">
                    <i className="fa-solid fa-circle-exclamation"></i>
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleAdminLoginSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-gray-700 dark:text-slate-300 mb-1">Password Admin</label>
                    <input 
                      type="password" 
                      required
                      placeholder="••••••••"
                      value={adminPasswordInput}
                      onChange={(e) => setAdminPasswordInput(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-gray-900 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition">
                    Masuk Mode Admin
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
